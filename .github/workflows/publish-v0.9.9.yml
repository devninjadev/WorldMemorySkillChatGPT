name: Publish v0.9.9

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify release archive
        run: |
          zip -r world-memory-autopilot-v0.9.9.zip world-memory-autopilot \
            -x '*/__pycache__/*' '*.py[cod]' '*/.pytest_cache/*' '*/.world-memory-runtime/*' '*/tmp*/*'
          sha256sum world-memory-autopilot-v0.9.9.zip > world-memory-autopilot-v0.9.9.zip.sha256
          unzip -t world-memory-autopilot-v0.9.9.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9.9 \
            world-memory-autopilot-v0.9.9.zip \
            world-memory-autopilot-v0.9.9.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "World Memory Autopilot v0.9.9" \
            --notes "Switches the five configured RSS.app feeds from XML to CSV as the sole canonical input. The packaged Python collector now parses the exact RSS.app CSV schema, keeps Link-first fingerprint identity and the existing publication-time corrections, and validates headers, UTF-8, dates, and row shape. RSS.app acquisition must use the packaged bounded direct-HTTP path; generic web fetch, web search, browser navigation, and XML are not fallbacks. The Notion schema and notion-v2 payload contract remain unchanged. Requires the Notion ChatGPT plugin, Python 3.10+, and outbound HTTPS."
