name: Publish v0.9.7

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify release archive
        run: |
          zip -r world-memory-autopilot-v0.9.7.zip world-memory-autopilot \
            -x '*/__pycache__/*' '*.py[cod]' '*/.pytest_cache/*' '*/.world-memory-runtime/*' '*/tmp*/*'
          sha256sum world-memory-autopilot-v0.9.7.zip > world-memory-autopilot-v0.9.7.zip.sha256
          unzip -t world-memory-autopilot-v0.9.7.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9.7 \
            world-memory-autopilot-v0.9.7.zip \
            world-memory-autopilot-v0.9.7.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "World Memory Autopilot v0.9.7" \
            --notes "Replaces the rigid report rendering with a friendly, beginner-readable Korean structure: an emoji-led title, Key Takeaway, market status, medium- and long-term context, selected decision-relevant indicators, next watch points, emerging issues, and a compact source/data note. The canonical Report v2 payload and Notion schema remain unchanged. Requires the Notion ChatGPT plugin, Python 3.10+, and outbound HTTPS."
