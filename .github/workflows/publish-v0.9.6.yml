name: Publish v0.9.6

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify release archive
        run: |
          zip -r world-memory-autopilot-v0.9.6.zip world-memory-autopilot \
            -x '*/__pycache__/*' '*.py[cod]' '*/.pytest_cache/*' '*/.world-memory-runtime/*' '*/tmp*/*'
          sha256sum world-memory-autopilot-v0.9.6.zip > world-memory-autopilot-v0.9.6.zip.sha256
          unzip -t world-memory-autopilot-v0.9.6.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9.6 \
            world-memory-autopilot-v0.9.6.zip \
            world-memory-autopilot-v0.9.6.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "World Memory Autopilot v0.9.6" \
            --notes "Adds a keyless volatility term-structure collector for VIX9D, VIX, VIX3M, and VIX6M. The public Google Sheet snapshot is validated leg by leg against official Cboe daily histories; stale or mismatched legs fall back independently to Cboe closes. Regular-session intraday values require an official previous-close anchor, and reports retain per-leg provenance and timestamp limitations. VIX3M and VIX6M are correctly labeled as volatility indices rather than futures. Requires the Notion ChatGPT plugin, Python 3.10+, and outbound HTTPS."
