name: Publish v0.9.1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release archive
        run: |
          zip -r world-memory-autopilot-v0.9.1.zip world-memory-autopilot \
            -x '*/__pycache__/*' '*.py[cod]' '*/.pytest_cache/*' '*/tmp*/*'
          sha256sum world-memory-autopilot-v0.9.1.zip > world-memory-autopilot-v0.9.1.zip.sha256
          unzip -t world-memory-autopilot-v0.9.1.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9.1 \
            world-memory-autopilot-v0.9.1.zip \
            world-memory-autopilot-v0.9.1.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "World Memory Autopilot v0.9.1" \
            --notes "Prioritizes fast, verified company and industry developments; adds US/KR-first geography and domain ordering; keeps unchanged cross-asset snapshots out of hourly briefings; and preserves qualified company news in six-hour integrations. Requires the Notion ChatGPT plugin (connector), Python 3.10+, and outbound HTTPS access."
