name: Publish v0.9.3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify release archive
        run: |
          zip -r world-memory-autopilot-v0.9.3.zip world-memory-autopilot \
            -x '*/__pycache__/*' '*.py[cod]' '*/.pytest_cache/*' '*/.world-memory-runtime/*' '*/tmp*/*'
          sha256sum world-memory-autopilot-v0.9.3.zip > world-memory-autopilot-v0.9.3.zip.sha256
          unzip -t world-memory-autopilot-v0.9.3.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9.3 \
            world-memory-autopilot-v0.9.3.zip \
            world-memory-autopilot-v0.9.3.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "World Memory Autopilot v0.9.3" \
            --notes "Adds Binance QQQUSDT and SPYUSDT as primary 24/7 U.S. equity direction proxies, plus a same-provider RSP/SPY breadth chain using Nasdaq, S&P Dow Jones Indices, Yahoo Finance, and cache. Also carries forward the cumulative full-size hourly report and Notion v2 integrity improvements prepared for v0.9.3. Requires the Notion ChatGPT plugin, Python 3.10+, and outbound HTTPS."
