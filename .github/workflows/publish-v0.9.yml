name: Publish v0.9

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release archive
        run: |
          zip -r world-memory-autopilot-v0.9.zip world-memory-autopilot \
            -x '*/__pycache__/*' '*.py[cod]' '*/.pytest_cache/*' '*/tmp*/*'
          sha256sum world-memory-autopilot-v0.9.zip > world-memory-autopilot-v0.9.zip.sha256
          unzip -t world-memory-autopilot-v0.9.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9 \
            world-memory-autopilot-v0.9.zip \
            world-memory-autopilot-v0.9.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "World Memory Autopilot v0.9" \
            --notes "Initial public release of World Memory Autopilot. Requires the Notion ChatGPT plugin (connector), Python 3.10+, and outbound HTTPS access. Scheduled automations are needed only for unattended hourly monitoring."
