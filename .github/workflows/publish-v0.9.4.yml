name: Publish v0.9.4

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify release archive
        run: |
          zip -r world-memory-autopilot-v0.9.4.zip world-memory-autopilot \
            -x '*/__pycache__/*' '*.py[cod]' '*/.pytest_cache/*' '*/.world-memory-runtime/*' '*/tmp*/*'
          sha256sum world-memory-autopilot-v0.9.4.zip > world-memory-autopilot-v0.9.4.zip.sha256
          unzip -t world-memory-autopilot-v0.9.4.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9.4 \
            world-memory-autopilot-v0.9.4.zip \
            world-memory-autopilot-v0.9.4.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "World Memory Autopilot v0.9.4" \
            --notes "Changes the nominal six-hour integration gate to become due after 5 hours 45 minutes, preventing a three-hour collection cadence from slipping integrations to nine hours. User-facing interval, report, notification, Korean rendering, and Next World Memory At semantics remain six-hour. Requires the Notion ChatGPT plugin, Python 3.10+, and outbound HTTPS."
