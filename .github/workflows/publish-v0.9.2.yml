name: Publish v0.9.2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify release archive
        run: |
          zip -r world-memory-autopilot-v0.9.2.zip world-memory-autopilot \
            -x '*/__pycache__/*' '*.py[cod]' '*/.pytest_cache/*' '*/.world-memory-runtime/*' '*/tmp*/*'
          sha256sum world-memory-autopilot-v0.9.2.zip > world-memory-autopilot-v0.9.2.zip.sha256
          unzip -t world-memory-autopilot-v0.9.2.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9.2 \
            world-memory-autopilot-v0.9.2.zip \
            world-memory-autopilot-v0.9.2.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "World Memory Autopilot v0.9.2" \
            --notes "Improves public market-data resilience by batching FRED series, running collection sources concurrently, validating Binance quotes at response receipt with bounded exchange-clock skew, and adding isolated yfinance bootstrap plus cache-aware Yahoo rate-limit fallback. Requires the Notion ChatGPT plugin, Python 3.10+, and outbound HTTPS."
